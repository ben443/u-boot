name: Build U-Boot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make python-is-python3

    - name: Build U-Boot
      run: |
        source ./board/qualcomm/hyp-sm8250.env
        cp board/qualcomm/hyp-sm8250.config .config
        sudo make
